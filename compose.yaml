services:
  niceproxy:
    build: .
    image: niceproxy:local
    restart: unless-stopped
    network_mode: host
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    environment:
      NICEPROXY_PANEL_LISTEN: ${NICEPROXY_PANEL_LISTEN:-127.0.0.1:9080}
      NICEPROXY_HTTP_PORT: ${NICEPROXY_HTTP_PORT:-80}
      NICEPROXY_HTTPS_PORT: ${NICEPROXY_HTTPS_PORT:-443}
      NICEPROXY_MAX_TCP_CONNECTIONS: ${NICEPROXY_MAX_TCP_CONNECTIONS:-16384}
      NICEPROXY_MAX_UDP_ASSOCIATIONS: ${NICEPROXY_MAX_UDP_ASSOCIATIONS:-1024}
      NICEPROXY_ALPHA_RELEASE_URL: ${NICEPROXY_ALPHA_RELEASE_URL:-}
      NICEPROXY_CF_REDIRECT_URL: ${NICEPROXY_CF_REDIRECT_URL:-}
    volumes:
      - niceproxy-data:/data
    tmpfs:
      - /run/niceproxy:mode=0700
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    stop_grace_period: 20s

volumes:
  niceproxy-data:
