name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  version:
    name: Calculate build version
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      value: ${{ steps.version.outputs.value }}
    steps:
      - id: version
        run: |
          value="0.1.${GITHUB_RUN_NUMBER}"
          echo "value=$value" >> "$GITHUB_OUTPUT"
          echo "Building niceproxy $value"

  go-test:
    name: Go tests with race detector
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Run race-enabled tests
        run: go test -race ./...

  go-vet:
    name: Go vet
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Run go vet
        run: go vet ./...

  go-splice:
    name: Verify TCP splice
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Install strace if missing
        run: |
          if ! command -v strace >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends strace
          fi

      - name: Verify TCP splice transfers data
        run: |
          go test -c -o "$RUNNER_TEMP/proxy.test" ./internal/proxy
          strace -f -qq -e trace=splice -o "$RUNNER_TEMP/splice.log" \
            "$RUNNER_TEMP/proxy.test" -test.run '^TestTCPMapping$'
          if ! grep -E 'splice(\(| resumed>).* = [1-9][0-9]*$' "$RUNNER_TEMP/splice.log"; then
            cat "$RUNNER_TEMP/splice.log"
            echo 'The TCP proxy test transferred no bytes with splice.' >&2
            exit 1
          fi

  web-test:
    name: Frontend ${{ matrix.task }}
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        task: [typecheck, test]
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm --prefix web ci

      - name: Run frontend check
        run: npm --prefix web run ${{ matrix.task }}

  integration:
    name: Build and integration smoke tests
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix web ci

      - name: Build frontend
        run: npm --prefix web run build

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Build niceproxy
        run: CGO_ENABLED=0 go build -trimpath -ldflags="-s -w -X main.version=${{ needs.version.outputs.value }}" -o bin/niceproxy ./cmd/niceproxy

      - name: Download pinned Caddy
        env:
          CADDY_VERSION: '2.10.2'
          CADDY_SHA512: 747df7ee74de188485157a383633a1a963fd9233b71fbb4a69ddcbcc589ce4e2cc82dacf5dbbe136cb51d17e14c59daeb5d9bc92487610b0f3b93680b2646546
        run: |
          mkdir -p bin
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/caddyserver/caddy/releases/download/v${CADDY_VERSION}/caddy_${CADDY_VERSION}_linux_amd64.tar.gz" \
            --output bin/caddy.tar.gz
          printf '%s  %s\n' "$CADDY_SHA512" bin/caddy.tar.gz | sha512sum --check --strict
          tar --extract --file bin/caddy.tar.gz --directory bin caddy
          bin/caddy version

      - name: Test real Caddy configuration and reloads
        env:
          NICEPROXY_CADDY_TEST_BINARY: ${{ github.workspace }}/bin/caddy
        run: go test ./internal/caddy -run '^TestRealCaddy$' -count=1

      - name: Run HTTP, HTTPS, TCP and UDP smoke test
        run: python3 scripts/smoke.py --caddy bin/caddy --binary bin/niceproxy

  image:
    name: Build and publish GHCR image
    needs: [version, go-test, go-vet, go-splice, web-test, integration]
    if: >-
      always() &&
      needs.version.result == 'success' &&
      needs.go-test.result == 'success' &&
      needs.go-vet.result == 'success' &&
      needs.go-splice.result == 'success' &&
      needs.web-test.result == 'success' &&
      needs.integration.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: metadata
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804 # v5.7.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ needs.version.outputs.value }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
            type=sha,prefix=sha-
            type=ref,event=branch
            type=ref,event=tag
          labels: |
            org.opencontainers.image.title=niceproxy
            org.opencontainers.image.description=Self-hosted Linux HTTP(S), TCP and UDP proxy
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ./Dockerfile
          build-args: |
            APP_VERSION=${{ needs.version.outputs.value }}
          push: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')) }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=niceproxy
          cache-to: type=gha,mode=max,scope=niceproxy
          provenance: mode=max
          sbom: true
